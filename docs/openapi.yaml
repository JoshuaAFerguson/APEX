openapi: 3.0.3
info:
  title: APEX API
  description: |
    REST API for APEX - Autonomous Product Engineering eXecutor.

    APEX provides AI-powered development automation with task management,
    agent orchestration, template-based workflows, MCP server marketplace,
    approval gates, and real-time streaming capabilities.

    ## Authentication
    Most endpoints require an `x-api-key` header. Public routes (`/health`,
    `/status`, `/metrics`, `/ws`) do not require authentication.
    Authentication can be disabled in `.apex/config.yaml` under `api.auth.enabled`.

    ## Rate Limiting
    All endpoints are rate-limited to 100 requests per minute per client.
    Rate limit information is returned in response headers.

    ## WebSocket
    Real-time streaming is available via WebSocket at `/ws` (global) and
    `/stream/{taskId}` (task-specific). WebSocket connections support
    `x-api-key` authentication via header or query parameter.
  version: 0.7.0
  contact:
    url: https://github.com/JoshuaAFerguson/apex
  license:
    name: MIT

servers:
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Health
    description: Server and daemon health checks
  - name: Tasks
    description: Task management operations
  - name: Subtasks
    description: Task decomposition and subtask management
  - name: Trash
    description: Soft-delete and trash management
  - name: Archive
    description: Task archival
  - name: Gates
    description: Approval gate operations
  - name: Approvals
    description: Approval workflow management
  - name: Confirmations
    description: Confirmation request handling
  - name: Agents
    description: Agent CRUD operations
  - name: Configuration
    description: APEX configuration
  - name: Templates
    description: Task template CRUD and instantiation
  - name: MCP Marketplace
    description: MCP server discovery and recommendations
  - name: MCP Management
    description: MCP server installation, lifecycle, and configuration
  - name: WebSocket
    description: Real-time event streaming
  - name: Screenshots
    description: Browser screenshot capabilities

security:
  - ApiKeyAuth: []

paths:
  # ==========================================================================
  # Health
  # ==========================================================================
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check if the server is running
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Server is healthy
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /daemon/health:
    get:
      tags:
        - Health
      summary: Daemon health check
      description: >
        Comprehensive health endpoint returning daemon status, memory usage,
        task counts, health-check history, and restart history. Returns 503
        when the daemon is not running.
      operationId: daemonHealthCheck
      responses:
        '200':
          description: Daemon is running (healthy or degraded)
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaemonHealthResponse'
        '503':
          description: Daemon not running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaemonUnavailableResponse'
        '500':
          description: Health check failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================================================
  # Tasks
  # ==========================================================================
  /tasks:
    get:
      tags:
        - Tasks
      summary: List tasks
      description: List all tasks with optional filtering, pagination, and lightweight mode
      operationId: listTasks
      parameters:
        - name: status
          in: query
          description: Filter by task status
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: limit
          in: query
          description: Maximum number of tasks to return (capped at 200)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          description: Number of tasks to skip for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: full
          in: query
          description: Set to "true" to include full task details (logs, artifacts)
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
            default: 'false'
      responses:
        '200':
          description: List of tasks
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'

    post:
      tags:
        - Tasks
      summary: Create task
      description: Create a new development task and start execution in the background
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created successfully
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTaskResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/stats:
    get:
      tags:
        - Tasks
      summary: Task statistics
      description: Lightweight task statistics for dashboard use
      operationId: getTaskStats
      responses:
        '200':
          description: Task statistics
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                type: object
                description: Task count statistics grouped by status

  /tasks/paused:
    get:
      tags:
        - Tasks
      summary: List paused tasks
      description: List all tasks currently in paused state
      operationId: listPausedTasks
      responses:
        '200':
          description: Paused tasks
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListWithMessage'

  /tasks/{id}:
    get:
      tags:
        - Tasks
      summary: Get task
      description: Retrieve details for a specific task with optional log pagination
      operationId: getTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: logLimit
          in: query
          description: Maximum number of log entries to return
          schema:
            type: integer
            default: 50
        - name: logOffset
          in: query
          description: Offset into the log entries
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Task details with optional log pagination metadata
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Task'
                  - type: object
                    properties:
                      logPagination:
                        $ref: '#/components/schemas/LogPagination'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{id}/status:
    post:
      tags:
        - Tasks
      summary: Update task status
      description: Update the status of a task (used by agents via curl)
      operationId: updateTaskStatus
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskStatusRequest'
      responses:
        '200':
          description: Status updated
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{id}/log:
    post:
      tags:
        - Tasks
      summary: Add log entry
      description: Add a log entry to a task
      operationId: addTaskLog
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddLogRequest'
      responses:
        '200':
          description: Log entry added
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{id}/cancel:
    post:
      tags:
        - Tasks
      summary: Cancel task
      description: Cancel a running task. Cannot cancel already completed or failed tasks.
      operationId: cancelTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task cancelled
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '400':
          description: Task cannot be cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{id}/retry:
    post:
      tags:
        - Tasks
      summary: Retry task
      description: Retry a failed, cancelled, or stuck in-progress/planning task
      operationId: retryTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task retry started
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '400':
          description: Task not in a retryable state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{id}/resume:
    post:
      tags:
        - Tasks
      summary: Resume task
      description: >
        Resume a paused task, start a pending/queued task, or continue
        executing pending subtasks of a parent task. Returns 400 if the
        task cannot be resumed (suggests using /retry for failed tasks).
      operationId: resumeTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task resumed or execution started
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
                  taskId:
                    type: string
                required:
                  - ok
                  - message
                  - taskId
        '400':
          description: Task cannot be resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict — task could not be resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{id}/context:
    post:
      tags:
        - Tasks
      summary: Inject context
      description: >
        Inject additional context into a running task. Context is broadcast
        to the task via WebSocket. Maximum 100,000 characters.
      operationId: injectContext
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InjectContextRequest'
      responses:
        '200':
          description: Context injected
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InjectContextResponse'
        '400':
          description: Invalid request or task in terminal state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================================================
  # Trash Management
  # ==========================================================================
  /tasks/{id}/trash:
    post:
      tags:
        - Trash
      summary: Move task to trash
      description: Soft-delete a task by moving it to the trash
      operationId: trashTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task moved to trash
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '400':
          description: Task is already in trash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{id}/restore:
    post:
      tags:
        - Trash
      summary: Restore task from trash
      description: Restore a previously trashed task
      operationId: restoreTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task restored from trash
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '400':
          description: Task is not in trash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/trashed:
    get:
      tags:
        - Trash
      summary: List trashed tasks
      description: List all tasks currently in the trash
      operationId: listTrashedTasks
      responses:
        '200':
          description: Trashed tasks
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListWithMessage'

  /tasks/trash:
    delete:
      tags:
        - Trash
      summary: Empty trash
      description: Permanently delete all trashed tasks
      operationId: emptyTrash
      responses:
        '200':
          description: Trash emptied
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  deletedCount:
                    type: integer
                  message:
                    type: string
                required:
                  - ok
                  - deletedCount
                  - message

  # ==========================================================================
  # Archive Management
  # ==========================================================================
  /tasks/{id}/archive:
    post:
      tags:
        - Archive
      summary: Archive task
      description: Archive a completed task
      operationId: archiveTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task archived
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '400':
          description: Task is already archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/archived:
    get:
      tags:
        - Archive
      summary: List archived tasks
      description: List all archived tasks
      operationId: listArchivedTasks
      responses:
        '200':
          description: Archived tasks
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListWithMessage'

  # ==========================================================================
  # Subtasks
  # ==========================================================================
  /tasks/{id}/decompose:
    post:
      tags:
        - Subtasks
      summary: Decompose task into subtasks
      description: Break a parent task into multiple subtasks with a given execution strategy
      operationId: decomposeTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecomposeTaskRequest'
      responses:
        '200':
          description: Task decomposed
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecomposeTaskResponse'
        '400':
          description: Invalid subtask definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{id}/subtasks:
    get:
      tags:
        - Subtasks
      summary: List subtasks
      description: Get all subtasks for a parent task
      operationId: listSubtasks
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Subtasks list
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                type: object
                properties:
                  parentTaskId:
                    type: string
                  subtasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  count:
                    type: integer
                required:
                  - parentTaskId
                  - subtasks
                  - count
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{id}/subtasks/status:
    get:
      tags:
        - Subtasks
      summary: Subtask status summary
      description: Get an aggregate status summary of all subtasks for a parent task
      operationId: getSubtaskStatus
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Subtask status summary
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                type: object
                properties:
                  parentTaskId:
                    type: string
                additionalProperties: true
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{id}/subtasks/execute:
    post:
      tags:
        - Subtasks
      summary: Execute subtasks
      description: Start executing all pending subtasks for a parent task in the background
      operationId: executeSubtasks
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Subtask execution started
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
                  parentTaskId:
                    type: string
                required:
                  - ok
                  - message
                  - parentTaskId
        '400':
          description: Task has no subtasks to execute
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{id}/parent:
    get:
      tags:
        - Subtasks
      summary: Get parent task
      description: Get the parent task of a subtask
      operationId: getParentTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Parent task
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found or not a subtask
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{id}/is-subtask:
    get:
      tags:
        - Subtasks
      summary: Check if task is a subtask
      description: Check whether a task is a subtask and return its parent ID if so
      operationId: isSubtask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Subtask check result
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId:
                    type: string
                  isSubtask:
                    type: boolean
                  parentTaskId:
                    type: string
                    nullable: true
                required:
                  - taskId
                  - isSubtask
                  - parentTaskId
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================================================
  # Gates
  # ==========================================================================
  /tasks/{id}/gates:
    get:
      tags:
        - Gates
      summary: List gates
      description: Get all approval gates for a task
      operationId: listGates
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: List of gates
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                type: object
                properties:
                  gates:
                    type: array
                    items:
                      type: object
                required:
                  - gates
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tasks/{id}/gates/{gateName}:
    get:
      tags:
        - Gates
      summary: Get gate status
      description: Check the status of an approval gate
      operationId: getGateStatus
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - name: gateName
          in: path
