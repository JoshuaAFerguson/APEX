        '200':
          description: Server stopped
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '500':
          description: Stop failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /mcp/installed:
    get:
      tags:
        - MCP Management
      summary: List installed MCP servers (detailed)
      description: List installed MCP servers as MCPInstallation objects with full metadata
      operationId: listMcpInstalled
      responses:
        '200':
          description: Installed MCP servers
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                type: object
                properties:
                  installations:
                    type: array
                    items:
                      $ref: '#/components/schemas/MCPInstallation'
                required:
                  - installations

  /mcp/install/{id}:
    post:
      tags:
        - MCP Management
      summary: Install MCP server (by ID)
      description: >
        Install an MCP server by marketplace ID. Broadcasts WebSocket
        events for installation progress tracking.
      operationId: installMcpServerById
      parameters:
        - name: id
          in: path
          required: true
          description: MCP server marketplace ID
          schema:
            type: string
      responses:
        '200':
          description: Server installed
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  message:
                    type: string
                  serverConfig:
                    type: object
                required:
                  - ok
                  - message
        '500':
          description: Installation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /mcp/uninstall/{id}:
    delete:
      tags:
        - MCP Management
      summary: Uninstall MCP server (by ID)
      description: >
        Uninstall an MCP server by marketplace ID. Broadcasts WebSocket
        events for uninstallation progress tracking.
      operationId: uninstallMcpServerById
      parameters:
        - name: id
          in: path
          required: true
          description: MCP server marketplace ID
          schema:
            type: string
      responses:
        '200':
          description: Server uninstalled
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
        '500':
          description: Uninstallation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /mcp/auto-configure:
    post:
      tags:
        - MCP Management
      summary: Auto-configure MCP tools
      description: >
        Automatically configure standard MCP tools based on project context.
        Optionally specify which tool categories to configure.
      operationId: autoConfigureMcp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoConfigureRequest'
      responses:
        '200':
          description: Auto-configuration completed
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoConfigureResponse'
        '500':
          description: Auto-configuration failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ==========================================================================
  # WebSocket
  # ==========================================================================
  /ws:
    get:
      tags:
        - WebSocket
      summary: Global WebSocket
      description: >
        WebSocket endpoint for receiving all task events globally. On connect,
        the server sends the current task list as a `task:state` message.
        Supports ping/pong health checks. Authentication via `x-api-key`
        header or query parameter.
      operationId: globalWebSocket
      security: []
      responses:
        '101':
          description: WebSocket upgrade
        '401':
          description: Unauthorized (when auth is enabled and no valid API key)

  /stream/{taskId}:
    get:
      tags:
        - WebSocket
      summary: Task-specific WebSocket
      description: >
        WebSocket endpoint for streaming events for a specific task.
        Supports optional event type filtering via the `events` query parameter
        (comma-separated list). On connect, sends the current task state.
        Authentication via `x-api-key` header or query parameter.
      operationId: taskWebSocket
      parameters:
        - name: taskId
          in: path
          required: true
          description: Task ID to stream events for
          schema:
            type: string
        - name: events
          in: query
          description: Comma-separated list of event types to subscribe to
          schema:
            type: string
            example: "task:started,task:completed,log:entry"
      responses:
        '101':
          description: WebSocket upgrade
        '401':
          description: Unauthorized (when auth is enabled and no valid API key)

  # ==========================================================================
  # Screenshots
  # ==========================================================================
  /screenshot/health:
    get:
      tags:
        - Screenshots
      summary: Screenshot service health
      description: Health check for the browser screenshot service
      operationId: screenshotHealth
      responses:
        '200':
          description: Screenshot service status
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/X-RateLimit-Limit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/X-RateLimit-Remaining'
          content:
            application/json:
              schema:
                type: object

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: >
        API key for authentication. Configure keys in `.apex/config.yaml`
        under `api.auth.apiKeys`. Can also be passed as a query parameter
        for WebSocket connections.

  headers:
    X-RateLimit-Limit:
      description: Maximum number of requests allowed in the current time window
      schema:
        type: integer
        example: 100
    X-RateLimit-Remaining:
      description: Number of requests remaining in the current time window
      schema:
        type: integer
        example: 97

  parameters:
    TaskId:
      name: id
      in: path
      required: true
      description: Task ID
      schema:
        type: string

  schemas:
    # ========================================================================
    # Health schemas
    # ========================================================================
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 0.7.0
      required:
        - status
        - version

    DaemonHealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - healthy
            - degraded
        metrics:
          $ref: '#/components/schemas/HealthMetrics'
        daemon:
          type: object
          properties:
            isRunning:
              type: boolean
            pid:
              type: integer
            startedAt:
              type: string
              format: date-time
            uptime:
              type: number
              description: Uptime in milliseconds
        timestamp:
          type: string
          format: date-time
      required:
        - status
        - metrics
        - daemon
        - timestamp

    DaemonUnavailableResponse:
      type: object
      properties:
        error:
          type: string
        status:
          type: string
          example: unavailable
        metrics:
          nullable: true
        message:
          type: string
      required:
        - error
        - status

    HealthMetrics:
      type: object
      properties:
        uptime:
          type: number
        memoryUsage:
          type: object
          properties:
            rss:
              type: integer
            heapTotal:
              type: integer
            heapUsed:
              type: integer
            external:
              type: integer
        taskCounts:
          type: object
          properties:
            processed:
              type: integer
            succeeded:
              type: integer
            failed:
              type: integer
            active:
              type: integer
        lastHealthCheck:
          type: string
          format: date-time
        healthChecksPassed:
          type: integer
        healthChecksFailed:
          type: integer
        restartHistory:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
              reason:
                type: string

    # ========================================================================
    # Enums
    # ========================================================================
    TaskStatus:
      type: string
      enum:
        - pending
        - queued
        - planning
        - in-progress
        - waiting-approval
        - paused
        - completed
        - failed
        - cancelled

    AutonomyLevel:
      type: string
      enum:
        - full
        - review-before-commit
        - review-before-merge
        - manual

    Priority:
      type: string
      enum:
        - low
        - normal
        - high
        - urgent

    Effort:
      type: string
      enum:
        - xs
        - small
        - medium
        - large
        - xl

    LogLevel:
      type: string
      enum:
        - debug
        - info
        - warn
        - error

    SubtaskStrategy:
      type: string
      enum:
        - sequential
        - parallel
        - adaptive

    # ========================================================================
    # Task schemas
    # ========================================================================
    TaskUsage:
      type: object
      properties:
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        totalTokens:
          type: integer
        estimatedCost:
          type: number
      required:
        - inputTokens
        - outputTokens
        - totalTokens
        - estimatedCost

    LogEntry:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        level:
          $ref: '#/components/schemas/LogLevel'
        message:
          type: string
        agent:
          type: string
        stage:
          type: string
        metadata:
          type: object
      required:
        - timestamp
        - level
        - message

    LogPagination:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean
      required:
        - total
        - limit
        - offset
        - hasMore

    Task:
      type: object
      properties:
        id:
          type: string
        description:
          type: string
        acceptanceCriteria:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        workflow:
          type: string
        autonomy:
          $ref: '#/components/schemas/AutonomyLevel'
        priority:
          $ref: '#/components/schemas/Priority'
        branchName:
          type: string
        currentStage:
          type: string
        retryCount:
          type: integer
        maxRetries:
          type: integer
        error:
          type: string
        prUrl:
          type: string
        parentTaskId:
          type: string
          nullable: true
        subtaskIds:
          type: array
          items:
            type: string
        trashedAt:
          type: string
          format: date-time
          nullable: true
        archivedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        usage:
          $ref: '#/components/schemas/TaskUsage'
        logs:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        artifacts:
          type: array
          items:
            type: object
      required:
        - id
        - description
        - status
        - workflow
        - autonomy
        - priority
        - createdAt
        - updatedAt
        - usage

    # ========================================================================
    # Request schemas
    # ========================================================================
    CreateTaskRequest:
      type: object
      properties:
        description:
          type: string
          description: Task description
        acceptanceCriteria:
          type: string
          description: Acceptance criteria
        workflow:
          type: string
          description: Workflow to use
          default: feature
        autonomy:
          $ref: '#/components/schemas/AutonomyLevel'
      required:
        - description

    UpdateTaskStatusRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/TaskStatus'
        stage:
          type: string
        message:
          type: string
      required:
        - status

    AddLogRequest:
      type: object
      properties:
        message:
          type: string
        level:
          $ref: '#/components/schemas/LogLevel'
        agent:
          type: string
      required:
        - message

    InjectContextRequest:
      type: object
      properties:
        context:
          type: string
          description: Context string to inject (max 100,000 characters)
          maxLength: 100000
        source:
          type: string
          description: Source identifier (max 50 characters)
          maxLength: 50
        priority:
          type: string
          description: Context priority
          enum:
            - low
            - normal
            - high
          default: normal
      required:
        - context

    ApproveGateRequest:
      type: object
      properties:
        approver:
          type: string
        comment:
          type: string

    ApprovalDecisionRequest:
      type: object
      properties:
        approver:
          type: string
          description: Identifier of the person making the decision
        comments:
          type: string
          description: Optional comments (required when denying)
      required:
        - approver

    ConfirmationRespondRequest:
      type: object
      properties:
        response:
          type: string
          enum:
            - accept
            - reject
          description: Accept or reject the confirmation
        approver:
          type: string
          description: Identifier of the responder
        comments:
          type: string
          description: Optional comments (required when rejecting)
      required:
        - response

    DecomposeTaskRequest:
      type: object
      properties:
        subtasks:
          type: array
          items:
            $ref: '#/components/schemas/SubtaskDefinition'
          minItems: 1
        strategy:
          $ref: '#/components/schemas/SubtaskStrategy'
      required:
        - subtasks

    SubtaskDefinition:
      type: object
      properties:
        description:
          type: string
        acceptanceCriteria:
          type: string
        workflow:
          type: string
        priority:
          $ref: '#/components/schemas/Priority'
      required:
        - description

    CreateTemplateRequest:
      type: object
      properties:
        name:
          type: string
          description: Template name (max 100 characters)
          maxLength: 100
        description:
          type: string
          description: Description of what this template does
        workflow:
          type: string
          description: Workflow to use for tasks created from this template
        priority:
          $ref: '#/components/schemas/Priority'
        effort:
          $ref: '#/components/schemas/Effort'
        acceptanceCriteria:
          type: string
        tags:
          type: array
          items:
            type: string
      required:
        - name
        - description
        - workflow

    UpdateTemplateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
        workflow:
          type: string
        priority:
          $ref: '#/components/schemas/Priority'
        effort:
          $ref: '#/components/schemas/Effort'
        acceptanceCriteria:
          type: string
        tags:
          type: array
          items:
            type: string

    AutoConfigureRequest:
      type: object
      properties:
        developmentTools:
          type: boolean
          description: Configure development-related MCP tools
        productivityTools:
          type: boolean
          description: Configure productivity-related MCP tools
        devopsTools:
          type: boolean
          description: Configure DevOps-related MCP tools
        customServers:
          type: array
          items:
            type: string
          description: List of custom server names to configure

    # ========================================================================
    # Response schemas
    # ========================================================================
    CreateTaskResponse:
      type: object
      properties:
        taskId:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        message:
          type: string
      required:
        - taskId
        - status
        - message

    TaskListResponse:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        count:
          type: integer
          description: Number of tasks in this response
        total:
          type: integer
          description: Total number of matching tasks
        limit:
          type: integer
        offset:
          type: integer
      required:
        - tasks
        - count
        - total
        - limit
        - offset

    TaskListWithMessage:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        count:
          type: integer
        message:
          type: string
      required:
        - tasks
        - count
        - message

    InjectContextResponse:
      type: object
      properties:
        ok:
          type: boolean
        taskId:
          type: string
        contextInjected:
          type: boolean
        timestamp:
          type: string
          format: date-time
      required:
        - ok
        - taskId
        - contextInjected
        - timestamp

    ApprovalDecisionResponse:
      type: object
      properties:
        success:
          type: boolean
        approvalState:
          type: object
          nullable: true
        willProceed:
          type: boolean
      required:
        - success
        - willProceed

    ConfirmationRespondResponse:
      type: object
      properties:
        success:
          type: boolean
        confirmationId:
          type: string
        response:
          type: string
          enum:
            - accept
            - reject
        approver:
          type: string
        comments:
          type: string
        forwarded:
          type: boolean
        confirmationState:
          type: object
          nullable: true
        timestamp:
          type: string
          format: date-time
      required:
        - success
        - confirmationId
        - response
        - forwarded
        - timestamp

    DecomposeTaskResponse:
      type: object
      properties:
        ok:
          type: boolean
        parentTaskId:
          type: string
        subtasks:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              description:
                type: string
              status:
                $ref: '#/components/schemas/TaskStatus'
            required:
              - id
              - description
              - status
        strategy:
          $ref: '#/components/schemas/SubtaskStrategy'
      required:
        - ok
        - parentTaskId
        - subtasks
        - strategy

    GateStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - not-required
            - pending
            - approved
            - rejected
      required:
        - status

    AutoConfigureResponse:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
        configured:
          type: array
          items:
            type: string
          description: Server names that were successfully configured
        skipped:
          type: array
          items:
            type: string
          description: Server names that were skipped
        errors:
          type: array
          items:
            type: string
          description: Error messages for servers that failed
      required:
        - ok
        - message
        - configured
        - skipped
        - errors

    # ========================================================================
    # Agent schemas
    # ========================================================================
    AgentDefinition:
      type: object
      properties:
        name:
          type: string
          description: >
            Agent name. Must start with lowercase letter, containing only
            lowercase letters, numbers, hyphens, and underscores.
          pattern: '^[a-z][a-z0-9-_]*$'
        description:
          type: string
        prompt:
          type: string
          description: System prompt for the agent
        tools:
          type: array
          items:
            type: string
        model:
          type: string
          enum:
            - opus
            - sonnet
            - haiku
      required:
        - name
        - description
        - prompt

    AgentDefinitionUpdate:
      type: object
      properties:
        description:
          type: string
        prompt:
          type: string
        tools:
          type: array
          items:
            type: string
        model:
          type: string
          enum:
            - opus
            - sonnet
            - haiku

    AgentsResponse:
      type: object
      properties:
        agents:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AgentDefinition'
      required:
        - agents

    # ========================================================================
    # Template schemas
    # ========================================================================
    TaskTemplate:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        workflow:
          type: string
        priority:
          $ref: '#/components/schemas/Priority'
        effort:
          $ref: '#/components/schemas/Effort'
        acceptanceCriteria:
          type: string
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - description
        - workflow
        - createdAt
        - updatedAt

    # ========================================================================
    # MCP schemas
    # ========================================================================
    MCPInstallation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        status:
          type: string
        installedAt:
          type: string
          format: date-time
        config:
          type: object

    # ========================================================================
    # Config schemas
    # ========================================================================
    ConfigResponse:
      type: object
      properties:
        version:
          type: string
        project:
          type: object
          properties:
            name:
              type: string
            language:
              type: string
            framework:
              type: string
        autonomy:
          type: object
          properties:
            default:
              $ref: '#/components/schemas/AutonomyLevel'
        models:
          type: object
          properties:
            planning:
              type: string
            implementation:
              type: string
            review:
              type: string
        limits:
          type: object
          properties:
            maxTokensPerTask:
              type: integer
            maxCostPerTask:
              type: number
            dailyBudget:
              type: number
        api:
          type: object
          properties:
            auth:
              type: object
              properties:
                enabled:
                  type: boolean
                apiKeys:
                  type: array
                  items:
                    type: string

    # ========================================================================
    # Generic response schemas
    # ========================================================================
    SuccessResponse:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok

    SuccessMessageResponse:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
      required:
        - ok
        - message

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        statusCode:
          type: integer
        message:
          type: string
      required:
        - error
